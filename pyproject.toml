[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasol-meta"
version = "0.1.0"
description = "Data curation and meta-learning utilities for aqueous-solubility model selection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "rdkit>=2024.3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=3.2,<4",
  "ngboost>=0.5.11,<0.6",
  "chemprop>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
aquasol-build-master = "aquasol_meta.build_master:main"
aquasol-build-targets = "aquasol_meta.build_targets:main"
aquasol-build-features = "aquasol_meta.build_features:main"
aquasol-build-splits = "aquasol_meta.build_splits:main"
aquasol-run-baselines = "aquasol_meta.run_baselines:main"
aquasol-build-meta-dataset = "aquasol_meta.build_failure_meta:main"
aquasol-build-source-holdouts = "aquasol_meta.build_source_holdouts:main"
aquasol-run-source-holdouts = "aquasol_meta.run_source_holdouts:main"
aquasol-run-chemprop = "aquasol_meta.run_chemprop:main"
aquasol-run-meta-model = "aquasol_meta.run_meta_model:main"
aquasol-build-reproducibility = "aquasol_meta.reproducibility:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
